seed: 42
device: cuda
output_dir: outputs
experiment_name: hybrid_cnn_transformer_main_eval
checkpoint_path: outputs/checkpoints/hybrid_cnn_transformer/best.pt

dataset:
  eval: configs/dataset_main.yaml
  split: val

dataset_split:
  seed: 42
  train_ratio: 0.8
  val_ratio: 0.1

model:
  name: hybrid_detector
  num_classes: 10
  use_transformer: true
  num_transformer_blocks: 1
  use_p2_branch: false
  neck_out_channels: 128
  transformer_heads: 4
  image_size: 1024
  score_threshold: 0.05
  nms_threshold: 0.5
  max_detections: 100

evaluation:
  batch_size: 1
  num_workers: 0
  score_threshold: 0.05
  save_predictions: false
  save_visualizations: false
  compute_per_class_ap: true
  compute_cross_dataset: false
